name: Build cross-platform releases

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: smiles-converter
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run tests
        shell: bash -el {0}
        run: |
          export PYTHONPATH="$PWD/src"
          pytest -q

      - name: Build Windows EXE
        shell: pwsh
        run: |
          conda run -n smiles-converter powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/smilestranlates-win.exe")) {
            throw "Windows EXE was not created."
          }
          Get-FileHash "dist/smilestranlates-win.exe" -Algorithm SHA256 |
            Out-File -Encoding utf8 "dist/smilestranlates-win-SHA256.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: smilestranlates-win
          path: |
            dist/smilestranlates-win.exe
            dist/smilestranlates-win-SHA256.txt
          if-no-files-found: error

      - name: Upload Windows release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smilestranlates-win.exe
            dist/smilestranlates-win-SHA256.txt

  build-macos:
    name: macOS APP
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: smiles-converter
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run tests
        shell: bash -el {0}
        run: |
          export PYTHONPATH="$PWD/src"
          pytest -q

      - name: Build macOS app
        shell: bash -el {0}
        run: |
          bash scripts/build_macos.sh
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/smilestranslate-mac.app" \
            "dist/smilestranslate-mac.zip"
          shasum -a 256 \
            "dist/smilestranslate-mac.zip" \
            > "dist/smilestranslate-mac-SHA256.txt"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: smilestranslate-mac
          path: |
            dist/smilestranslate-mac.zip
            dist/smilestranslate-mac-SHA256.txt
          if-no-files-found: error

      - name: Upload macOS release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smilestranslate-mac.zip
            dist/smilestranslate-mac-SHA256.txt

  build-linux:
    name: Linux executable
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tk runtime
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: smiles-converter
          environment-file: environment.yml
          auto-activate-base: false

      - name: Run tests
        shell: bash -el {0}
        run: |
          export PYTHONPATH="$PWD/src"
          pytest -q

      - name: Build Linux executable
        shell: bash -el {0}
        run: |
          bash scripts/build_linux.sh
          sha256sum \
            "dist/smilestranslate-Linux-x86_64" \
            > "dist/smilestranslate-Linux-x86_64-SHA256.txt"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: smilestranslate-Linux-x86_64
          path: |
            dist/smilestranslate-Linux-x86_64
            dist/smilestranslate-Linux-x86_64-SHA256.txt
          if-no-files-found: error

      - name: Upload Linux release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smilestranslate-Linux-x86_64
            dist/smilestranslate-Linux-x86_64-SHA256.txt
